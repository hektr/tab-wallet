<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
     * {
     box-sizing: border-box;
   }
   
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --success: #10b981;
      --success-hover: #059669;
      --bg: #ffffff;
      --surface: #f8fafc;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --radius: 8px;
    }

    body {
      width: 360px;
      padding: 20px;
      margin: 0;
      overflow-x: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.1;
    }

    h2 {
      margin: 0 0 12px 0;
      font-size: 18px;
      font-weight: 700;
      text-align: center;
      color: var(--text);
      letter-spacing: -0.025em;
    }

    button {
      font-size: 14px;
      font-weight: 500;
      padding: 8px 16px;
      border-radius: var(--radius);
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .stats {
      text-align: center;
      margin-bottom: 20px;
    }

    .stat-value {
      font-size: 24px;
      font-weight: 700;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: var(--primary);
    }

    .stat-label {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .save-btn {
      width: 100%;
      padding: 12px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: var(--radius);
      font-weight: 600;
      font-size: 15px;
      margin-bottom: 20px;
      box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2);
    }

    .save-btn:hover:not(:disabled) {
      background-color: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 4px 6px rgba(37, 99, 235, 0.3);
    }

    .sessions-header {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 10px;
    }

    .session-list {
      max-height: 260px;
      overflow-y: auto;
    }

    .session-list::-webkit-scrollbar {
      width: 6px;
    }

    .session-list::-webkit-scrollbar-thumb {
      background-color: #cbd5e1;
      border-radius: 3px;
    }

    .session-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .session-item:hover {
      border-color: var(--primary);
      background: #eff6ff
    }

    .session-info {
      flex-grow: 1;
    }

    .session-name {
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 2px;
    }

    .session-meta {
      font-size: 12px;
      color: var(--text-muted);
    }

    .session-count {
      background: var(--primary);
      color: white;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }

    .empty-msg {
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
      margin-top: 24px;
      font-style: italic;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(2px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal {
      background: white;
      padding: 24px;
      border-radius: 12px;
      width: 280px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
      z-index: 1001;
    }

    .modal h3 {
      margin: 0 0 16px 0;
      font-size: 16px;
      font-weight: 600;
    }

    .modal input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 16px;
      box-sizing: border-box;
      font-size: 14px;
    }

    .modal input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
    }

    .modal-buttons button {
      flex: 1;
    }

    .cancel-btn {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .cancel-btn:hover {
      background: #e2e8f0;
    }

    .confirm-btn {
      background: var(--primary);
      color: white;
    }

    .confirm-btn:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    .back-btn {
      background: transparent;
      color: var(--text-muted);
      border: none;
      padding: 4px 8px;
      font-size: 13px;
      margin-bottom: 16px;
    }

    .back-btn:hover {
      color: var(--primary);
    }

    .tab-list {
      max-height: 240px;
      overflow-y: auto;
      overflow-x: hidden;
      margin-bottom: 16px;
    }

    .tab-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      background: var(--surface);
      border-radius: var(--radius);
      margin-bottom: 6px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .tab-item .remove-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 4px 8px;
      font-size: 18px;
      line-height: 1;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-item .remove-btn:hover {
      background-color: #fee2e2;
      color: var(--danger);
    }

    .tab-item:hover {
      background: #e2e8f0;
    }

    .tab-item:active {
      background: #cbd5e1;
    }

    .tab-favicon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .tab-url {
      flex-grow: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .restore-btn {
      width: 100%;
      background: var(--success);
      color: white;
      margin-bottom: 8px;
    }

    .restore-btn:hover:not(:disabled) {
      background: var(--success-hover);
    }

    .delete-btn {
      width: 100%;
      background: var(--surface);
      color: var(--danger);
      border: 1px solid var(--border);
    }

    .delete-btn:hover:not(:disabled) {
      background: #fee2e2;
      border-color: var(--danger);
    }

    .divider {
      height: 1px;
      background-color: var(--border);
      margin: 20px 0 16px 0;
    }

    .donate-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 10px;
      background-color: transparent;
      color: var(--text-muted);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      text-decoration: none;
      font-weight: 500;
      font-size: 13px;
      transition: all 0.2s ease;
      box-sizing: border-box;
    }

    .donate-btn:hover {
      background-color: #fff7ed;
      color: #ea580c;
      border-color: #fdba74;
      border-style: solid;
      transform: translateY(-1px);
    }

    .donate-btn svg {
      margin-right: 8px;
      transition: transform 0.2s ease;
    }

    .donate-btn:hover svg {
      transform: scale(1.1);
      fill: #ffedd5;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="mainView">
    <h2>Tab Wallet</h2>
    
    <div class="stats">
      <div class="stat-value" id="tabCount">0</div>
      <div class="stat-label">Open tabs</div>
    </div>

    <button class="save-btn" id="saveBtn">Save to Wallet</button>

    <div class="sessions-header">Saved Sessions</div>
    <div class="session-list" id="sessionList"></div>

    <div class="divider"></div>
    <a href="https://boosty.to/hektr992" target="_blank" rel="noopener noreferrer" class="donate-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
      </svg>
      Support the developer
    </a>
  </div>

  <div class="modal-overlay" id="saveModal">
    <div class="modal">
      <h3>Save Session</h3>
      <input type="text" id="sessionNameInput" placeholder="Session name">
      <label class="checkbox-label">
        <input type="checkbox" id="closeTabsCheckbox" checked>
        Also close all tabs
      </label>
      <div class="modal-buttons">
        <button class="cancel-btn" id="cancelSaveBtn">Cancel</button>
        <button class="confirm-btn" id="confirmSaveBtn">Save</button>
      </div>
    </div>
  </div>

  <div id="sessionDetailView" class="hidden">
    <button class="back-btn" id="backBtn">← Back</button>
    <h2 id="sessionTitle">Session</h2>
    
    <div class="session-meta" id="sessionMeta" style="text-align: center; margin-bottom: 16px;">0 tabs</div>

    <div class="tab-list" id="tabList"></div>

    <button class="restore-btn" id="restoreBtn">Restore All Tabs</button>
    <button class="delete-btn" id="deleteBtn">Delete Session</button>

    <div class="divider"></div>
    <a href="https://boosty.to/hektr992" target="_blank" rel="noopener noreferrer" class="donate-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
      </svg>
      Support the developer
    </a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
